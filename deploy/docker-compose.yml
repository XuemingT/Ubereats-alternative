services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    env_file: .env
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    env_file: .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  config-server:
    build: { context: .., dockerfile: Dockerfile.service, args: { MODULE: config-server } }
    ports: ["8888:8888"]

  order-service:
    build: { context: .., dockerfile: Dockerfile.service, args: { MODULE: order-service } }
    environment: &backend-env
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    env_file: .env
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy }, redis: { condition: service_healthy }, config-server: { condition: service_started } }

  product-service:
    build: { context: .., dockerfile: Dockerfile.service, args: { MODULE: product-service } }
    environment: *backend-env
    env_file: .env
    ports: ["8082:8082"]
    depends_on: [order-service]

  discount-service:
    build: { context: .., dockerfile: Dockerfile.service, args: { MODULE: discount-service } }
    environment: *backend-env
    env_file: .env
    ports: ["8083:8083"]
    depends_on: [order-service]

  accounting-service:
    build: { context: .., dockerfile: Dockerfile.service, args: { MODULE: accounting-service } }
    environment: *backend-env
    env_file: .env
    ports: ["8081:8081"]
    depends_on: [order-service]

  payment-service:
    build: { context: .., dockerfile: Dockerfile.service, args: { MODULE: payment-service } }
    environment: *backend-env
    env_file: .env
    ports: ["8084:8084"]
    depends_on: [order-service]

  delivery-service:
    build: { context: .., dockerfile: Dockerfile.service, args: { MODULE: delivery-service } }
    environment: *backend-env
    env_file: .env
    ports: ["8085:8085"]
    depends_on: [order-service]

  frontend:
    build: { context: ../frontend, dockerfile: Dockerfile }
    ports: ["80:80"]
    depends_on: [order-service, delivery-service]

volumes:
  postgres-data:
